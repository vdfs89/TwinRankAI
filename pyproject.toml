[tool.poetry]
name = "retailrocket-reco"
version = "0.1.0"
description = "Sistema de recomendação two-tower para e-commerce (RetailRocket) — Tech Challenge Fase 2"
authors = ["Vitor Diogo Fonseca da Silva"]
license = "MIT"
readme = "README.md"
packages = [{ include = "reco", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
# Wheel de CPU explicito. O wheel default do PyPI arrasta as libs CUDA
# (~2,7 GB de nvidia/ mais 689 MB de triton) para uma imagem que serve em CPU e
# usa faiss-cpu. O requirements.txt ja apontava para este indice; sem a fonte
# declarada aqui, o build Docker (que instala por Poetry) continuava baixando a
# variante com GPU.
# Versao exata, nao faixa: Docker, requirements.txt e a maquina de treino
# precisam do mesmo torch para o resultado ser reproduzivel. Antes deste pin as
# tres fontes divergiam, e a imagem baixava a variante com CUDA.
torch = { version = "2.13.0", source = "pytorch-cpu" }
scikit-learn = "^1.5.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
mlflow = "^2.14.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
pandera = "^0.19.0"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
dvc = { extras = ["s3"], version = "^3.51.0" }
python-dotenv = "^1.0.1"
faiss-cpu = "^1.8.0"
redis = "^5.0.0"
streamlit = "^1.36.0"
requests = "^2.32.0"
plotly = "^6.9.0"
[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
ruff = "^0.5.0"
pre-commit = "^3.7.0"
jupyter = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=src/reco --cov-report=term-missing"
