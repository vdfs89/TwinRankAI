repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Os manifests do k8s agrupam Deployment e Service no mesmo arquivo,
        # separados por `---`. Sem esta flag o hook rejeita o segundo documento.
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=5000]
